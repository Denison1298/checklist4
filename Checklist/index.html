<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checklist e Atendimentos</title>
    <link rel="icon" href="https://github.com/Denison1298/checklist4/blob/main/Checklist/img/icon.png?raw=true" type="image/png">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        .tab-content { display: none; }
        .active { display: block; }

        /* Ajusta a rolagem lateral na tabela */
        .table-responsive {
            overflow-x: auto;
            white-space: nowrap;
        }

        /* Ajusta o gráfico */
        .chart-container {
            width: 100%;
            max-width: 1200px;
            height: 400px;
            margin: auto;
            overflow-x: auto;
        }

        #myChart {
            width: 100%;
            height: 100%;
            background: white;
        }
    </style>
</head>
<body class="bg-gray-900 text-white">

    <!-- Header -->
    <header class="bg-gradient-to-r from-blue-700 to-indigo-800 p-6 text-center shadow-lg">
        <div class="flex justify-center">
            <img src="https://github.com/Denison1298/checklist4/blob/main/Checklist/img/Logo.png?raw=true" alt="Fivecoin Logo" class="h-16">
        </div>
        <h1 class="text-2xl font-bold mt-3">Checklist e Atendimentos</h1>
    </header>

    <!-- Container principal -->
    <div class="container mx-auto mt-6">

        <!-- Tabs -->
        <div class="flex justify-center space-x-4 mb-6">
            <button class="btn btn-primary" onclick="showTabContent('checklist')">Checklist</button>
            <button class="btn btn-success" onclick="showTabContent('atendimentos')">Atendimentos Mensais</button>
            <button class="btn btn-danger" onclick="showTabContent('dashboard')">Dashboard</button>
        </div>

        <!-- Tab: Checklist -->
        <div id="checklist" class="tab-content active bg-gray-800 p-6 rounded shadow-lg">
            <h2 class="text-2xl font-bold mb-4 text-yellow-400">Checklist de Atendimentos</h2>

            <!-- Atendimento Interno -->
            <h3 class="text-lg font-semibold text-white">Atendimento Interno</h3>
            <div class="mb-4 flex flex-col md:flex-row gap-2">
                <input type="text" id="protocoloInterno" class="form-control md:w-1/2" placeholder="Digite o protocolo do Atendimento Interno">
                <button class="btn btn-primary" onclick="enviarProtocolo('interno')">Enviar</button>
            </div>

            <!-- Atendimento Externo -->
            <h3 class="text-lg font-semibold text-white">Atendimento Externo</h3>
            <div class="mb-4 flex flex-col md:flex-row gap-2">
                <input type="text" id="protocoloExterno" class="form-control md:w-1/2" placeholder="Digite o protocolo do Atendimento Externo">
                <button class="btn btn-primary" onclick="enviarProtocolo('externo')">Enviar</button>
            </div>

            <!-- Mensagem de sucesso -->
            <div id="successMessage" class="alert alert-success hidden"></div>
        </div>

        <!-- Tab: Atendimentos -->
        <div id="atendimentos" class="tab-content bg-gray-800 p-6 rounded shadow-lg">
            <h2 class="text-2xl font-bold mb-4 text-green-300">Lista de Atendimentos</h2>

            <!-- Tabela responsiva -->
            <div class="table-responsive mt-4">
                <table id="atendimentosTable" class="table table-striped table-dark w-full">
                    <thead>
                        <tr>
                            <th>Tipo</th>
                            <th>Protocolo</th>
                            <th>Data e Hora</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="atendimentosBody">
                        <!-- Dados dinâmicos serão inseridos aqui -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Tab: Dashboard -->
        <div id="dashboard" class="tab-content bg-gray-800 p-6 rounded shadow-lg">
            <h2 class="text-2xl font-bold mb-4 text-red-300">Dashboard</h2>

            <!-- Gráfico -->
            <div class="chart-container">
                <canvas id="myChart"></canvas>
            </div>

            <!-- Contadores -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mt-6 text-center">
                <div class="bg-gray-700 p-4 rounded shadow-lg">Total Interno: <span id="contadorInterno">0</span></div>
                <div class="bg-gray-700 p-4 rounded shadow-lg">Total Externo: <span id="contadorExterno">0</span></div>
                <div class="bg-gray-700 p-4 rounded shadow-lg">Total Geral: <span id="contadorGeral">0</span></div>
                <div class="bg-gray-700 p-4 rounded shadow-lg">Média Diária: <span id="contadorMedia">0</span></div>
            </div>
        </div>

        <!-- Rodapé -->
        <footer class="text-center mt-10">
            <p class="text-gray-400">Desenvolvido por Denison Santos</p>
        </footer>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            carregarGrafico();
        });

        function carregarGrafico() {
            let canvas = document.getElementById("myChart");

            if (canvas.chart) {
                canvas.chart.destroy();
            }

            let ctx = canvas.getContext("2d");

            let dias = ["01/02", "02/02", "03/02", "04/02", "05/02", "06/02", "07/02"];
            let atendimentosData = [5, 12, 8, 15, 7, 10, 14];

            canvas.chart = new Chart(ctx, {
                type: "bar",
                data: {
                    labels: dias,
                    datasets: [{
                        label: "Atendimentos por Dia",
                        data: atendimentosData,
                        backgroundColor: "rgba(0, 0, 139, 0.8)", // Azul escuro
                        borderColor: "rgba(0, 0, 139, 1)",
                        borderWidth: 1,
                        barThickness: 25
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: { beginAtZero: true, ticks: { color: "#000" } },
                        x: { ticks: { color: "#000" } }
                    },
                    plugins: {
                        legend: { labels: { color: "#000" } }
                    }
                }
            });

            canvas.style.backgroundColor = "#ffffff";
        }

        function showTabContent(tabName) {
            let tabs = document.querySelectorAll(".tab-content");
            tabs.forEach(tab => tab.classList.remove("active"));
            document.getElementById(tabName).classList.add("active");
        }
    </script>
</body>
</html>
